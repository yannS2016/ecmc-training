# deps.conf -- source dependencies built by build-deps.sh
#
# These are NOT EPICS modules. They are ordinary libraries and tools that the
# ecmc stack needs, which are not packaged for Rocky 9 and so must be built from
# source at a pinned version.
#
# Format, whitespace separated. Use "-" for an empty field.
#
#   name     type       version    source                        [options...]
#
#   name     directory created under $DEPS_DIR
#   type     cmake | autotools | make | fetch
#              cmake      cmake -B build, then cmake --build build
#              autotools  autoreconf if needed, ./configure, make, make install
#              make       plain make in the source root
#              fetch      clone and checkout only; nothing to build
#   version  git tag, branch or commit. Tags are strongly preferred: a branch
#            moves, and then "the same config" stops meaning the same thing.
#   source   git URL, or a .tar.gz / .tar.bz2 / .tgz URL
#   options  passed to the configure step (cmake -D..., ./configure --...).
#            The pseudo-flag --submodules also inits git submodules.
#            --prefix=DIR installs there; without it the build stays in-tree.
#
# Check for newer tags before pinning:
#   git ls-remote --tags <url> | grep -v '\^{}' | sed 's|.*refs/tags/||' | sort -V | tail
#
# ---------------------------------------------------------------------------

# ruckig -- jerk-limited (S-curve) online trajectory generation.
#
# ecmc links this when ECMC_TRAJ_TYPE=1. Note ecmc's application Makefile
# expects the library to stay in the SOURCE TREE's build/ directory and sets an
# rpath into it:
#
#   USR_LDFLAGS += -L$(RUCKIG)/build -lruckig
#   USR_LDFLAGS += -Wl,-rpath,'$(RUCKIG)/build'
#
# So do NOT give ruckig a --prefix. Installing it elsewhere and deleting the
# build tree stops a previously working IOC from starting. See MODULES.md s.7.
#
# BUILD_SHARED_LIBS=ON matters: the rpath above only helps a shared library.
ruckig    cmake    v0.19.4    https://github.com/pantor/ruckig.git    -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF

# ---------------------------------------------------------------------------
# Deliberately NOT listed here
#
# etherlab   The IgH EtherCAT master builds a KERNEL MODULE, so it is tied to
#            the running kernel and breaks on every kernel update. It needs the
#            care that ethercatmaster/BUILD.md and INSTALL.md give it, not a
#            line in a table. Build it there.
#
# exprtk     Header-only, and it arrives as a git submodule inside the ecmc
#            source tree. Nothing to fetch or build separately.
#
# EPICS base and the EPICS modules (asyn, motor, ecmc, ecmccfg, ecmccomp).
#            Different build system, different dependency mechanism
#            (configure/RELEASE), different install layout. Out of scope for
#            this tool; see MODULES.md for how they are built.
