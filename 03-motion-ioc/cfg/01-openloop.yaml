# =============================================================================
# Stage 1 -- open loop
#
# EL7062 in CSV mode using ONLY its internal microstep counter as the encoder.
# No BiSS-C, no external feedback. The axis moves and reports a position, but
# that position is what was COMMANDED, not what happened.
#
# CSV, not CSP -- see README section 3. EL7062 has a confirmed CSV firmware
# bug (open-loop counter jumps to nearest full turn on every disable), but
# CSP only makes sense when the drive closes its OWN loop against a
# shaft-mounted encoder. Ours (EL5042) measures the LOAD, not the shaft, so
# CSP would force ecmc's setpoints and the drive's own loop into two
# different, only loosely-related coordinate frames (hence the old
# useAsCSPDrvEnc dual-encoder workaround). CSV keeps the position loop
# entirely in ecmc, where the real feedback is -- the firmware bug is an
# accepted, known risk for now, not an oversight.
#
# drive.type is INDEPENDENT of CSV/CSP: it selects the enable handshake
# (ecmcDriveStepper's bare enable-bit vs ecmcDriveDS402's real 0x06/0x07/0x0F
# sequence), not what the setpoint means. This EL7062 firmware runs a real
# DS402 state machine internally regardless of CSV/CSP, confirmed empirically
# (driveStatus02 stuck at 0x60 "Switch on disabled" -- DS402 status bits 6/0/1/2
# -- while ecmc wrote a bare controlWord=1, which DS402 correctly ignores).
# Hence type: 1 below, even though this is CSV.
#
# Loaded by:
#   ${ecmccfg_DIR}loadYamlAxis.cmd "FILE=./cfg/01-openloop.yaml, DEV=..., DRV_SID=..."
#
# SCALING BELOW ASSUMES a 1 mm/rev stage. Measure yours -- exercise 1.
# =============================================================================

axis:
  id: ${AXIS_ID=1}
  mode: CSV
  autoEnable:
    # 1.0s was too tight for this EL7062's real DS402 enable handshake
    # (multiple state transitions on real hardware) -- ecmc aborted a
    # pending move as not-yet-enabled before the drive actually finished
    # enabling, producing a premature internal STOP mid-move and a
    # downstream ERROR_MON_STALL. Confirmed empirically on real hardware.
    enableTimeout: 15.0
    disableTimeout: 5.0

epics:
  name: ${AX_NAME=M1}
  precision: 3
  description: Training axis (open loop)
  unit: mm
  motorRecord:
    fieldInit: 'RTRY=0,FOFF=Frozen'

drive:
  # CSV: ecmc sends a VELOCITY setpoint each cycle, not a position.
  #
  # 16384 microsteps/fullstep is a FIXED EL7062 hardware constant (confirmed
  # via Beckhoff spec) -- not stage- or motor-specific, and NOT the same
  # thing as "fullsteps/rev" despite the confusingly similar old comment here
  # ("64 microsteps x 16384 steps/rev" had the two swapped: PSI's motor was
  # 64 fullsteps/rev x 16384 microsteps/fullstep = 1048576).
  #
  # Our real motor: 200 fullsteps/rev (confirmed via SDO 0x8111:33 "Motor
  # fullsteps per revolution" -- matches the 1.8 deg/step datasheet value).
  # counts/motor-rev = 200 x 16384 = 3276800.
  #
  # denominator below still assumes a 1 mm/rev STAGE pitch -- that part is
  # independent of the motor and still an unmeasured placeholder. Re-derive
  # once exercise 1 gives you the real mm/rev: denominator = 3276800 / (mm
  # per motor revolution of YOUR stage).
  numerator: 1
  denominator: 3276800
  type: 1                       # DS402 enable handshake -- see header comment
  setpoint: ec0.s$(DRV_SID).velocitySetpoint${DRV_CH=01}
  control: ec0.s$(DRV_SID).driveControl${DRV_CH=01}
  status: ec0.s$(DRV_SID).driveStatus${DRV_CH=01}

encoder:
  desc: Openloop
  numerator: 1
  denominator: 3276800          # must match the drive scaling above
  type: 0                       # incremental
  bits: 32
  absBits: 0
  position: ec0.s$(DRV_SID).positionActual${DRV_CH=01}
  status: ec0.s$(DRV_SID).encoderStatus${DRV_CH=01}

  homing:
    type: 15                    # set position: no motion, "you are here"
    position: 0

controller:
  # The only "encoder" here is the drive's own step counter, which just
  # tracks commanded steps -- not an independent measurement. ecmc's
  # trajectory velocity passes straight through as the CSV setpoint; gains
  # are near-zero deliberately. Stage 2 turns this into a real loop once
  # there is an independent measurement (EL5042).
  Kp: 0.0
  Ki: 0.0
  Kd: 0.0

trajectory:
  type: 1                       # ruckig jerk-limited
  axis:
    velocity: 1
    acceleration: 10
    deceleration: 10
    emergencyDeceleration: 20
    jerk: 200
  jog:
    velocity: 1

input:
  # The EL7062 has its own digital inputs, two per channel. This crate has no
  # separate digital input terminal, so if you wire limit switches, they go here.
  # Until they are wired and verified, ONE.0 (constant 1) means "always healthy".
  #
  # Set these to the binaryInputs lines only after you have confirmed polarity
  # by hand -- README section 8.
  limit:
    forward: 'ec0.s$(DRV_SID).ONE.0'
    backward: 'ec0.s$(DRV_SID).ONE.0'
  home: 'ec0.s$(DRV_SID).ONE.0'
  interlock: 'ec0.s$(DRV_SID).ONE.0'

softlimits:
  enable: false                 # no trustworthy position yet -- stage 2

monitoring:
  lag:
    enable: false               # meaningless: feedback IS the setpoint
    tolerance: 1
    time: 100
  target:
    enable: true                # required by the motor record
    tolerance: 0.01
    time: 10
  velocity:
    enable: true
    max: 8
    time:
      trajectory: 100
      drive: 200
