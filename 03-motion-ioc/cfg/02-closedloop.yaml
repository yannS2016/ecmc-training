# =============================================================================
# Stage 2 -- closed loop on the BiSS-C absolute encoder
#
# ONE encoder: the RLS BiSS-C absolute linear scale on the EL5042. Measures
# the LOAD. ecmc closes the position loop against it directly and sends a
# VELOCITY setpoint to the drive (CSV, not CSP) -- see README section 3 and
# cfg/01-openloop.yaml's header. There used to be a second "drive-frame"
# encoder here (the EL7062's own internal counter, flagged useAsCSPDrvEnc)
# to keep the drive's own CSP position loop in the same coordinate system as
# ecmc's setpoints. CSV doesn't have that problem -- the drive never runs its
# own position loop, so there is nothing to keep in sync. enc-openloop.yaml
# is no longer loaded in stage 2.
#
# drive.type is INDEPENDENT of CSV/CSP -- see cfg/01-openloop.yaml's header.
# This EL7062 firmware runs a real DS402 enable state machine regardless of
# CSV/CSP, confirmed empirically, so type: 1 below even though this is CSV.
#
# Loaded by:
#   loadYamlAxis.cmd  FILE=./cfg/02-closedloop.yaml   ENC_SID=<EL5042 pos>
# =============================================================================

axis:
  id: ${AXIS_ID=1}
  mode: CSV
  autoEnable:
    # See cfg/01-openloop.yaml's header -- 1.0s was too tight for this
    # EL7062's real DS402 enable handshake, confirmed empirically.
    enableTimeout: 15.0
    disableTimeout: 5.0

epics:
  name: ${AX_NAME=M1}
  precision: 3
  description: Training axis (closed loop, BiSS-C)
  unit: mm
  motorRecord:
    fieldInit: 'RTRY=0,FOFF=Frozen'

drive:
  # 200 fullsteps/rev (confirmed via SDO) x 16384 microsteps/fullstep (fixed
  # EL7062 constant) = 3276800 counts/motor-rev -- see cfg/01-openloop.yaml's
  # header for the full derivation. Still assumes a 1 mm/rev stage pitch;
  # re-derive once exercise 1 gives the real value.
  numerator: 1
  denominator: 3276800
  type: 1                       # DS402 enable handshake -- see header comment
  setpoint: ec0.s$(DRV_SID).velocitySetpoint${DRV_CH=01}
  control: ec0.s$(DRV_SID).driveControl${DRV_CH=01}
  status: ec0.s$(DRV_SID).driveStatus${DRV_CH=01}

encoder:
  desc: BISS-C
  # RLS linear scale: 4096 counts per mm.
  numerator: 1
  denominator: 4096
  type: 1                       # ABSOLUTE -- position is known at power-on
  bits: 32                      # total width of the raw PDO value
  absBits: 26                   # meaningful absolute bits, least significant

  # absOffset maps the scale's raw absolute reading onto YOUR machine
  # coordinates. This is the absolute-encoder equivalent of homing: you measure
  # it once, write it here, and the axis knows where it is at every power-on
  # forever after. The value below is from the PSI lab stage and is certainly
  # WRONG for yours -- exercise 3 derives it.
  absOffset: ${ABS_OFFSET=-15626.058}

  position: ec0.s$(ENC_SID).positionActual${ENC_CH=01}
  status: ec0.s$(ENC_SID).encoderStatus${ENC_CH=01}
  ready: 2                      # bit in the status word: encoder ready
  warning: 0
  error:
    - 1

controller:
  # NOW the loop is real: setpoint comes from the trajectory, feedback from an
  # independent measurement of the load. Backlash, lost steps, and compliance
  # all show up here as following error and get corrected.
  #
  # Start low. These are the PSI lab values for a 1 mm/rev stage -- a starting
  # point, not a recommendation. Exercise 4 tunes them.
  Kp: 0.1
  Ki: 0.01
  Kd: 0

trajectory:
  type: 1
  axis:
    velocity: 1
    acceleration: 10
    deceleration: 10
    emergencyDeceleration: 20
    jerk: 200
  jog:
    velocity: 1

input:
  limit:
    forward: 'ec0.s$(DRV_SID).ONE.0'
    backward: 'ec0.s$(DRV_SID).ONE.0'
  home: 'ec0.s$(DRV_SID).ONE.0'
  interlock: 'ec0.s$(DRV_SID).ONE.0'

softlimits:
  # Now meaningful: with an absolute encoder the position is trustworthy from
  # power-on, with no homing move required. Set these to your real travel.
  enable: true
  backwardEnable: true
  backward: ${SOFT_LOW=1.0}
  forwardEnable: true
  forward: ${SOFT_HIGH=45.0}

monitoring:
  lag:
    # The most valuable protection on the machine, and only possible now that
    # feedback is independent of the command. Catches a jam, a stall, a slipping
    # coupling -- anything where the load stops following.
    enable: true
    tolerance: 1
    time: 100
  target:
    enable: true
    tolerance: 0.01
    time: 10
  velocity:
    enable: true
    max: 8
    time:
      trajectory: 100
      drive: 200
