# =============================================================================
# The SECOND encoder for stage 2 -- the EL7062's internal microstep counter.
#
# Loaded separately, AFTER the axis, with loadYamlEnc.cmd:
#
#   ${ecmccfg_DIR}loadYamlEnc.cmd "FILE=./cfg/enc-openloop.yaml, DEV=..., ENC_SID=<EL7062 pos>"
#
# Note ENC_SID here is the DRIVE's bus position, not the EL5042's: this counter
# lives inside the stepper terminal.
#
# WHY THIS FILE EXISTS
# --------------------
# In CSP the drive runs its own position loop against this counter. ecmc sends
# position setpoints in the BiSS-C coordinate system, but the drive interprets
# them in the counter's coordinate system. Unless ecmc knows about both, the two
# disagree and the axis runs away or refuses to settle.
#
# useAsCSPDrvEnc marks this as the encoder the drive is closing on, and
# homing.refToEncIDAtStartup: 1 tells ecmc to seed it from encoder 1 (BiSS-C) at
# startup, putting both into the same frame.
#
# This is the configuration that the classic .ax dialect cannot express -- there
# is no ECMC_* variable for either setting. See README section 7.
# =============================================================================

encoder:
  desc: Openloop
  unit: mm
  numerator: 1
  denominator: 1048576          # microsteps per mm -- match the drive scaling
  type: 0                       # incremental
  bits: 32
  position: ec0.s$(ENC_SID).positionActual${ENC_CH=01}
  status: ec0.s$(ENC_SID).encoderStatus${ENC_CH=01}

  homing:
    # Reference this counter to encoder 1 (BiSS-C) at startup, so the drive's
    # frame and ecmc's frame agree from the first cycle. No motion involved.
    refToEncIDAtStartup: 1

  useAsCSPDrvEnc: 1
