# Drop-in for ethercat.service -- GENERIC driver.
#
# The generic driver talks through the normal Linux network stack, so the
# interface must be configured before the master starts. Taken from the
# commented guidance in the master's own script/ethercat.service.in.
#
# Install to: /etc/systemd/system/ethercat.service.d/50-dependencies.conf
# Mutually exclusive with 50-dependencies-native.conf.
[Unit]
Requires=network.target
After=network.target
