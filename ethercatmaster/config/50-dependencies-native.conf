# Drop-in for ethercat.service -- NATIVE driver (e1000e / igb / igc).
#
# ethercatctl rmmod's the stock NIC driver and loads the EtherCAT one in its
# place, so this must happen BEFORE the network configuration tools look at the
# interfaces -- otherwise they get confused by a NIC that vanishes and returns.
#
# Install to: /etc/systemd/system/ethercat.service.d/50-dependencies.conf
# Mutually exclusive with 50-dependencies-generic.conf.
[Unit]
Before=network-pre.target
Wants=network-pre.target
