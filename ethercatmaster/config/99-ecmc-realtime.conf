# Realtime privileges for the IOC.
#
# ecmc's cyclic thread needs SCHED_FIFO and locked memory. Granting them to a
# group is the alternative to running a bus-facing process as root.
#
# Install to: /etc/security/limits.d/99-ecmc-realtime.conf
# Takes effect at next login.
@ethercat  -  rtprio   90
@ethercat  -  memlock  unlimited
