# Make libethercat.so discoverable system-wide.
#
# ecmc itself bakes an rpath (-Wl,-rpath=$(ETHERLAB)/lib), so it does not
# strictly need this -- but the `ethercat` CLI and anything built later do.
# Mirrors what ecmc's own .ci/ethercat.bash does.
#
# Install to: /etc/ld.so.conf.d/ethercat.conf   (then: ldconfig)
/opt/etherlab/lib
