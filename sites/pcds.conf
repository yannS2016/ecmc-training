# pcds.conf -- SLAC PCDS site configuration.
#
#   cd <training repo>
#   cp sites/pcds.conf site.conf
#   ./00-bootstrap/preflight.sh
#
# Copy rather than symlink: site.conf is gitignored, so a copy lets you tweak a
# path on one host without dirtying this file for everyone.
#
# This is the counterpart to site.conf.example. The example documents what each
# key means with placeholder values; this records the real values for one site.
# Trainees on their own hardware start from the example instead.

# --- EPICS ------------------------------------------------------------------
EPICS_BASE=/cds/group/pcds/epics/base/R7.0.3.1-2.0
EPICS_MODULES=/cds/group/pcds/epics/modules/R7.0.3.1-2.0

# PCDS builds under its own architecture name. Auto-detection from
# $EPICS_BASE/startup/EpicsHostArch returns the upstream "linux-x86_64", which
# is NOT what the binaries are under here, so this must be set explicitly.
EPICS_HOST_ARCH=rhel9-x86_64

# --- Source checkouts (read, never modified) --------------------------------
# An EPICS module is its own built source tree, so these normally sit inside
# EPICS_MODULES. Adjust if the checkouts live elsewhere on your host.
ECMC_SRC=/cds/group/pcds/epics/modules/R7.0.3.1-2.0/ecmc
ECMCCFG_SRC=/cds/group/pcds/epics/modules/R7.0.3.1-2.0/ecmccfg
ECMCCOMP_SRC=/cds/group/pcds/epics/modules/R7.0.3.1-2.0/ecmccomp

# --- EtherCAT ---------------------------------------------------------------
ETHERLAB=/opt/etherlab

# --- Source dependencies ----------------------------------------------------
# Laid out as $DEPS_DIR/<package>/<version>.
DEPS_DIR=/cds/group/pcds/pkg_mgr

# --- IOC --------------------------------------------------------------------
IOC_PREFIX=TRAIN
