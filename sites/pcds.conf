# pcds.conf -- SLAC PCDS site configuration.
#
#   cd <training repo>
#   cp sites/pcds.conf site.conf
#   ./00-bootstrap/preflight.sh
#
# Copy rather than symlink: site.conf is gitignored, so a copy lets you tweak a
# path on one host without dirtying this file for everyone.
#
# This is the counterpart to site.conf.example. The example documents what each
# key means with placeholder values; this records the real values for one site.
# Trainees on their own hardware start from the example instead.

# --- EPICS ------------------------------------------------------------------
EPICS_BASE=/cds/group/pcds/epics/base/R7.0.3.1-2.0

# Note the ordering: the base version sits BETWEEN "epics" and "modules", so it
# is epics/<base-ver>/modules, not epics/modules/<base-ver>. Confirmed from a
# build log:
#   /cds/group/pcds/epics/R7.0.3.1-2.0/modules/ecmc/R11.0.8/devEcmcSup/O.rhel9-x86_64
EPICS_MODULES=/cds/group/pcds/epics/R7.0.3.1-2.0/modules

# PCDS builds under its own architecture name. Auto-detection from
# $EPICS_BASE/startup/EpicsHostArch returns the upstream "linux-x86_64", which
# is NOT what the binaries are under here, so this must be set explicitly.
EPICS_HOST_ARCH=rhel9-x86_64

# --- Source checkouts (read, never modified) --------------------------------
# An EPICS module is its own built source tree, so these sit inside
# EPICS_MODULES -- and because the tree is versioned, the version is part of the
# path. ECMC_SRC below matches the build log exactly:
#   /cds/group/pcds/epics/R7.0.3.1-2.0/modules/ecmc/R11.0.8/devEcmcSup/...
ECMC_SRC=/cds/group/pcds/epics/R7.0.3.1-2.0/modules/ecmc/R11.0.8

# CONFIRM THESE TWO. They follow the same pattern, but the version directories
# have not been observed yet:
#   ls -d $EPICS_MODULES/ecmccfg/* $EPICS_MODULES/ecmccomp/*
# ecmccfg must be at tag 11.0.8 to match ecmc; see ../VERSIONS.md.
ECMCCFG_SRC=/cds/group/pcds/epics/R7.0.3.1-2.0/modules/ecmccfg/R11.0.8
ECMCCOMP_SRC=/cds/group/pcds/epics/R7.0.3.1-2.0/modules/ecmccomp/R0.2.16

# --- EtherCAT ---------------------------------------------------------------
ETHERLAB=/opt/etherlab

# --- Source dependencies ----------------------------------------------------
# Laid out as $DEPS_DIR/<package>/RX.Y.Z, matching the EPICS module tree.
DEPS_DIR=/cds/group/pcds/pkg_mgr

# --- IOC --------------------------------------------------------------------
IOC_PREFIX=TRAIN

# --- EPICS module versions ---------------------------------------------------
# PCDS module trees are versioned: $EPICS_MODULES/<module>/<version>.
# Confirm against the actual tree before trusting these:
#   ls -d $EPICS_MODULES/asyn/* $EPICS_MODULES/motor/*
ASYN_MODULE_VERSION=R4.42-1.0.0
MOTOR_MODULE_VERSION=R6.10.1-2.6.1

# ecmc is installed in the site module tree as ecmc/R11.0.8, per the build log.
ECMC_MODULE_VERSION=R11.0.8
